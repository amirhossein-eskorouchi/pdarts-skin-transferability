name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintained-package:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install maintained package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt

      - name: Validate dataset contracts
        run: python scripts/validate_data_contracts.py

      - name: Validate experiment configurations
        run: python scripts/validate_experiment_configs.py

      - name: Validate publication record
        run: python scripts/validate_publication_record.py

      - name: Verify generated publication tables
        run: python scripts/build_publication_tables.py --check

      - name: Audit repository release boundary
        run: python scripts/audit_repository.py

      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v
