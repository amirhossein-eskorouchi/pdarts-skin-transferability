[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdarts-skin-transferability"
version = "0.1.0"
description = "Reproducibility contracts and analysis utilities for P-DARTS skin-lesion transferability research"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "PDARTS Skin Transferability Contributors"}
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pdarts-validate-manifest = "pdarts_skin.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
